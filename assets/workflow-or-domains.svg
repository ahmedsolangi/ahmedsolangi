<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Business domain experience</title>
  <desc id="desc">Six business domains connected to a central ERP workflow: manufacturing, retail, real estate, healthcare, education, and restaurant and point of sale.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse"><stop stop-color="#081321"/><stop offset=".5" stop-color="#0A1124"/><stop offset="1" stop-color="#071B24"/></linearGradient>
    <linearGradient id="flow" x1="180" y1="0" x2="1020" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#8B7CFF"/><stop offset=".52" stop-color="#5EAAFF"/><stop offset="1" stop-color="#42D3A7"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <rect x="1" y="1" width="1198" height="358" rx="22" fill="url(#bg)" stroke="#7891B6" stroke-opacity=".2" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="60" y="54" fill="#8FA3C0" font-size="13" font-weight="700" letter-spacing="1.8">ONE ENGINEERING DISCIPLINE · MULTIPLE OPERATING CONTEXTS</text>
    <text x="1140" y="54" fill="#5EE7F7" text-anchor="end" font-size="12" font-weight="700">DOMAIN MAP / 06</text>

    <path d="M120 178H1080" stroke="#34506F" stroke-opacity=".5" stroke-width="2"/>
    <path d="M120 178H370" stroke="url(#flow)" stroke-width="5" stroke-linecap="round" filter="url(#blur)" opacity=".3">
      <animate attributeName="d" values="M120 178H370;M430 178H680;M750 178H1000;M120 178H370" dur="7s" repeatCount="indefinite"/>
    </path>
    <g stroke="#527396" stroke-opacity=".55"><path d="M198 178V126"/><path d="M358 178V230"/><path d="M518 178V126"/><path d="M682 178V230"/><path d="M842 178V126"/><path d="M1002 178V230"/></g>
    <g fill="#091525" stroke-width="2.5">
      <circle cx="198" cy="178" r="7" stroke="#8B7CFF"/><circle cx="358" cy="178" r="7" stroke="#7E92FF"/><circle cx="518" cy="178" r="7" stroke="#5EAAFF"/><circle cx="682" cy="178" r="7" stroke="#5EC8FF"/><circle cx="842" cy="178" r="7" stroke="#5EE7F7"/><circle cx="1002" cy="178" r="7" stroke="#42D3A7"/>
    </g>

    <g transform="translate(104 76)"><rect width="188" height="52" rx="14" fill="#12182F" stroke="#8B7CFF" stroke-opacity=".42"/><text x="20" y="32" fill="#DCD8FF" font-size="16" font-weight="700">Manufacturing</text></g>
    <g transform="translate(264 229)"><rect width="188" height="52" rx="14" fill="#101A31" stroke="#7E92FF" stroke-opacity=".42"/><text x="20" y="32" fill="#D7DCFF" font-size="16" font-weight="700">Retail</text></g>
    <g transform="translate(424 76)"><rect width="188" height="52" rx="14" fill="#0E1B32" stroke="#5EAAFF" stroke-opacity=".42"/><text x="20" y="32" fill="#CDE6FF" font-size="16" font-weight="700">Real Estate</text></g>
    <g transform="translate(588 229)"><rect width="188" height="52" rx="14" fill="#0D1D31" stroke="#5EC8FF" stroke-opacity=".42"/><text x="20" y="32" fill="#C9EBFF" font-size="16" font-weight="700">Healthcare</text></g>
    <g transform="translate(748 76)"><rect width="188" height="52" rx="14" fill="#0C1F2F" stroke="#5EE7F7" stroke-opacity=".42"/><text x="20" y="32" fill="#C7F7FC" font-size="16" font-weight="700">School / Education</text></g>
    <g transform="translate(908 229)"><rect width="188" height="52" rx="14" fill="#0B222A" stroke="#42D3A7" stroke-opacity=".42"/><text x="20" y="32" fill="#C7F7E8" font-size="16" font-weight="700">Restaurant / POS</text></g>

    <rect x="391" y="305" width="418" height="30" rx="15" fill="#0D1829" stroke="#5EAAFF" stroke-opacity=".2"/>
    <text x="600" y="325" text-anchor="middle" fill="#8EA2BF" font-size="12" font-weight="700" letter-spacing="1.1">PROCESS → DATA → AUTOMATION → VISIBILITY</text>
  </g>
  <circle cx="198" cy="178" r="13" fill="none" stroke="#8B7CFF"><animate attributeName="r" values="8;18;8" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0;.8" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="1002" cy="178" r="13" fill="none" stroke="#42D3A7"><animate attributeName="r" values="8;18;8" dur="4s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0;.8" dur="4s" begin="2s" repeatCount="indefinite"/></circle>
</svg>
