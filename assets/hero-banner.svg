        <text x="838" y="125" text-anchor="middle" fill="#C7C2FF">ERP LOGIC</text>
        <rect x="1000" y="275" width="108" height="30" rx="15" fill="#0C2230" stroke="#42D3A7" stroke-opacity="0.42"/>
        <text x="1054" y="295" text-anchor="middle" fill="#98F3D7">OPERATIONS</text>
        <rect x="712" y="322" width="106" height="30" rx="15" fill="#0C1D32" stroke="#5EE7F7" stroke-opacity="0.38"/>
        <text x="765" y="342" text-anchor="middle" fill="#A9F1FA">AUTOMATION</text>
      </g>
