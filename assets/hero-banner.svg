      <circle cx="95" cy="80" r="4" fill="#42D3A7">
        <animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="110" y="85" fill="#B8C8DE" font-size="13" font-weight="700" letter-spacing="1.1">OPEN TO GLOBAL OPPORTUNITIES</text>

      <text x="76" y="178" fill="#F2F6FF" font-size="62" font-weight="700" letter-spacing="-1.8">Ahmed Solangi</text>
      <rect x="77" y="197" width="508" height="4" rx="2" fill="url(#accent)">
        <animate attributeName="width" values="150;508;508" dur="2.5s" repeatCount="indefinite"/>
      </rect>
      <text x="77" y="240" fill="#D4DDF0" font-size="24" font-weight="600">Software Engineer · Senior Odoo ERP Developer</text>
      <text x="77" y="273" fill="#90A3BF" font-size="20">&amp; Implementer</text>
      <text x="77" y="325" fill="#B4C0D4" font-size="17">Turning operational complexity into maintainable ERP systems.</text>

      <g transform="translate(77 354)">
        <rect width="128" height="34" rx="10" fill="#111B35" stroke="#8B7CFF" stroke-opacity="0.48"/>
