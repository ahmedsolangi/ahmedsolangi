        <rect x="140" width="116" height="34" rx="10" fill="#0C1D32" stroke="#5EAAFF" stroke-opacity="0.48"/>
        <text x="198" y="22" text-anchor="middle" fill="#B8D9FF" font-size="13" font-weight="700">5+ YEARS</text>
        <rect x="268" width="160" height="34" rx="10" fill="#0C2230" stroke="#42D3A7" stroke-opacity="0.48"/>
        <text x="348" y="22" text-anchor="middle" fill="#A7F0D9" font-size="13" font-weight="700">ERP ENGINEERING</text>
