<svg width="1200" height="270" viewBox="0 0 1200 270" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Professional profile overview</title>
  <desc id="desc">More than five years of experience, Odoo versions 15 through 20, development and implementation, and six business domains.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081221"/><stop offset=".52" stop-color="#0B1125"/><stop offset="1" stop-color="#071A25"/>
    </linearGradient>
    <linearGradient id="bar" x1="65" y1="0" x2="1135" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B7CFF"/><stop offset=".5" stop-color="#5EAAFF"/><stop offset="1" stop-color="#42D3A7"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-200%" width="160%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect x="1" y="1" width="1198" height="268" rx="22" fill="url(#bg)" stroke="#7891B6" stroke-opacity=".2" stroke-width="2"/>
  <path d="M65 52H1135" stroke="#6B83A8" stroke-opacity=".18"/>
  <circle cx="65" cy="52" r="4" fill="#8B7CFF"/>
  <text x="82" y="57" fill="#8FA3C0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">PROFILE SIGNAL</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(65 83)">
      <rect width="246" height="128" rx="18" fill="#10182E" stroke="#8B7CFF" stroke-opacity=".34"/>
      <text x="24" y="56" fill="#A99FFF" font-size="34" font-weight="700">5+ years</text>
      <text x="24" y="88" fill="#D7DFEE" font-size="15" font-weight="600">ERP delivery experience</text>
      <text x="24" y="108" fill="#8295B2" font-size="12">Development · implementation · optimization</text>
    </g>
    <g transform="translate(331 83)">
      <rect width="246" height="128" rx="18" fill="#0D1A31" stroke="#5EAAFF" stroke-opacity=".34"/>
      <text x="24" y="56" fill="#74B8FF" font-size="34" font-weight="700">v15 → v20</text>
      <text x="24" y="88" fill="#D7DFEE" font-size="15" font-weight="600">Odoo platform range</text>
      <text x="24" y="108" fill="#8295B2" font-size="12">Custom modules · upgrades · integrations</text>
    </g>
    <g transform="translate(597 83)">
      <rect width="246" height="128" rx="18" fill="#0C1C30" stroke="#5EE7F7" stroke-opacity=".34"/>
      <text x="24" y="56" fill="#72E7F5" font-size="29" font-weight="700">Build + deliver</text>
      <text x="24" y="88" fill="#D7DFEE" font-size="15" font-weight="600">Engineering &amp; implementation</text>
      <text x="24" y="108" fill="#8295B2" font-size="12">From requirements to reliable operations</text>
    </g>
    <g transform="translate(863 83)">
      <rect width="272" height="128" rx="18" fill="#0B2029" stroke="#42D3A7" stroke-opacity=".34"/>
      <text x="24" y="56" fill="#5DE0B5" font-size="34" font-weight="700">6 domains</text>
      <text x="24" y="88" fill="#D7DFEE" font-size="15" font-weight="600">Operational context</text>
      <text x="24" y="108" fill="#8295B2" font-size="12">Manufacturing · retail · services · more</text>
    </g>
  </g>
  <rect x="65" y="234" width="1070" height="3" rx="1.5" fill="#182641"/>
  <rect x="65" y="234" width="300" height="3" rx="1.5" fill="url(#bar)" filter="url(#glow)">
    <animate attributeName="x" values="65;835;65" dur="8s" repeatCount="indefinite"/>
  </rect>
